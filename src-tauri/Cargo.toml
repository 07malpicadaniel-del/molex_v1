[package]
name = "molex_desktop"
version = "0.2.0"
description = "Molex PC-to-PC Remote Desktop with Tailscale VPN & Wake-on-LAN"
authors = ["Daniel Malpica"]
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
molex_core = { package = "client", path = "../molex_motor/client", default-features = false }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }
dirs = "5.0"
uuid = { version = "1", features = ["v4"] }
